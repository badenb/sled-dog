[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sled-dog-cli"
version = "1.0.2"
description = "A finite, read-only GitHub pull request companion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "rich>=13,<15", "keyring>=25,<26", "tzdata>=2025.1"]

[project.scripts]
sled-dog = "sled_dog.cli:main"

[tool.setuptools.packages.find]
include = ["sled_dog*"]
